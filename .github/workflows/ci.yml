name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══ 测试 (跨平台, 快速) ═══
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Core Tests
        run: dotnet test test/TradingStudio.Core.Tests/TradingStudio.Core.Tests.csproj --configuration Release --verbosity normal

      - name: Data Tests
        run: dotnet test test/TradingStudio.Data.Tests/TradingStudio.Data.Tests.csproj --configuration Release --verbosity normal

      - name: Engine Tests
        run: dotnet test test/TradingStudio.Engine.Tests/TradingStudio.Engine.Tests.csproj --configuration Release --verbosity normal

      - name: ToolBox Build
        run: dotnet build src/TradingStudio.ToolBox/TradingStudio.ToolBox.csproj --configuration Release

  # ═══ 主程序编译 (Windows only, C++/CLI 依赖) ═══
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # C++/CLI 需要 MSVC 工具链
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build CTP Wrapper
        run: dotnet build src/CTP/Wrapper/CTPWrapper.vcxproj --configuration Release

      - name: Build TradingStudio
        run: dotnet build src/TradingStudio/TradingStudio.csproj --configuration Release
